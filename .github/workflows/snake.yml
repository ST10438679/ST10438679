name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#d9a21b&color_dots=#ebedf0,#f7e3a1,#efc94c,#d9a21b,#9c7a16
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5c518&color_dots=#1a160b,#5c4a12,#9c7a16,#d9a21b,#f5c518

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
