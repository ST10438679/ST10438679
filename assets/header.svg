<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Liam Swile, .NET and cloud developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0c07"/>
      <stop offset="1" stop-color="#1a160b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#d9a21b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9a21b" stop-opacity="0"/>
    </radialGradient>
    <!-- horizontal scanlines -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#f5c518" fill-opacity="0.035"/>
    </pattern>
    <!-- diagonal hatching like the circuit texture in the reference -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="2" height="10" fill="#f5c518" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="hatchFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="hatchMask"><rect width="900" height="260" fill="url(#hatchFade)"/></mask>
    <clipPath id="frame"><rect width="900" height="260" rx="6"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 1.2s; } .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.0s; } .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 3.2s; }
    .l7 { animation-delay: 3.9s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .fade { opacity: 0; animation: fadein 0.8s ease-out forwards; }
    .f2 { animation-delay: 0.25s; } .f3 { animation-delay: 0.5s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#hatch)" mask="url(#hatchMask)"/>
    <rect width="900" height="260" fill="url(#glow)"/>
    <rect width="900" height="260" fill="url(#glow2)"/>
    <rect width="900" height="260" fill="url(#scan)"/>
    <rect y="0" width="900" height="3" fill="#f5c518"/>
  </g>

  <!-- HUD crosshairs -->
  <g stroke="#f5c518" stroke-opacity="0.55" stroke-width="1.2">
    <path d="M408 20v12M402 26h12"/>
    <path d="M408 228v12M402 234h12"/>
    <path d="M24 234h10M24 234v-10" fill="none"/>
  </g>

  <!-- Left: name and title -->
  <g class="sans">
    <text x="44" y="96" class="fade" font-size="46" font-weight="800" fill="#f5c518" letter-spacing="-0.5">Liam Swile</text>
    <text x="44" y="138" class="fade f2" font-size="19" fill="#f3e9c6">.NET &amp; Cloud Developer</text>
    <text x="44" y="166" class="fade f3 mono" font-size="13.5" fill="#a8975f">C# · ASP.NET Core · Azure · Docker</text>
    <g class="fade f3 mono" font-size="12.5">
      <rect x="44" y="190" width="9" height="9" fill="#f5c518" class="pulse"/>
      <text x="62" y="199" fill="#f5c518">OPEN TO JUNIOR / GRADUATE ROLES</text>
    </g>
  </g>

  <!-- Right: terminal -->
  <g transform="translate(452 30)">
    <rect width="412" height="172" rx="4" fill="#0a0904" fill-opacity="0.9" stroke="#f5c518" stroke-opacity="0.35"/>
    <rect width="412" height="24" rx="4" fill="#f5c518"/>
    <rect y="16" width="412" height="8" fill="#f5c518"/>
    <text x="12" y="16.5" class="mono" font-size="11" font-weight="700" fill="#0e0c07">LIAM@DEV:~/PORTFOLIO</text>
    <text x="400" y="16.5" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#0e0c07">[■ ■ ■]</text>

    <g class="mono" font-size="13">
      <text x="16" y="48" class="line l1"><tspan fill="#f5c518">&gt;</tspan><tspan fill="#f3e9c6"> dotnet run --project liam</tspan></text>
      <text x="16" y="70" class="line l2" fill="#d9c27a">  + REST APIs with JWT auth</text>
      <text x="16" y="90" class="line l3" fill="#d9c27a">  + Azure Functions + Storage</text>
      <text x="16" y="110" class="line l4" fill="#d9c27a">  + Docker Compose + GitHub Actions</text>
      <text x="16" y="130" class="line l5" fill="#d9c27a">  + Factory · Observer · Decorator</text>
      <text x="16" y="154" class="line l6"><tspan fill="#f5c518">&gt;</tspan><tspan fill="#f3e9c6"> dotnet test</tspan><tspan fill="#f5c518" font-weight="700">  PASSED</tspan><tspan fill="#a8975f"> 0 failed</tspan><tspan fill="#f5c518" class="cursor"> █</tspan></text>
    </g>
  </g>

  <!-- HUD readout + target box, bottom right -->
  <g class="mono" font-size="10.5" fill="#f5c518" fill-opacity="0.85">
    <text x="800" y="222" text-anchor="end">[.NET 10]  BUILD: OK</text>
    <text x="800" y="236" text-anchor="end">SEQ ST10438679.2026</text>
  </g>
  <g transform="translate(812 212)" stroke="#f5c518" stroke-opacity="0.85" fill="none" stroke-width="1">
    <rect width="28" height="28"/>
    <rect x="7" y="7" width="14" height="14"/>
    <path d="M0 0L28 28M28 0L0 28" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="2.2" fill="#f5c518"/>
  </g>
</svg>
